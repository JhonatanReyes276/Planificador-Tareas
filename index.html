<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#planificador">
                <span class="titulo">Planificador de Tareas</span>
            </a>
        </div>
    </nav>

    <main>
        <section id="planificador">
            <div clas="container">
                <div class="row g-4">
                    <div class="col-6">
                        <article class="tarjeta tarjeta-form py-4 px-4">
                            <fieldset class="bloque-form py-2">
                                <legend class="titulo-bloque">Nueva tarea</legend>
                                <div class="row g-3">
                                    <div class="col-12">
                                        <label class="etiqueta-form" for="nombre">Nombre</label>
                                        <input class="campo form-control" type="text" id="nombre" name="nombre"
                                            placeholder="Tu nombre" required />
                                    </div>

                                    <div class="col-12">
                                        <label class="etiqueta-form" for="descripcion">Descripción</label>
                                        <input class="campo form-control" type="text" id="descripcion"
                                            name="descripcion" placeholder="Contenido de la tarea" />
                                    </div>

                                    <div class="col-12">
                                        <label class="etiqueta-form" for="email">Limite de realización</label>
                                        <input class="campo form-control" type="number" id="limite" name="limite"
                                            placeholder="Fecha de entrega de la tarea" required />
                                    </div>
                                </div>
                            </fieldset>

                            <button class="boton-agregar" type="submit">Agregar tarea</button>
                        </article>

                        <article class="container h-100">
                            <div class="container">
                                <h4>Tareas finalizadas</h4>
                                <ul class="terminadas">
                                    <li class="f1">1 Tarea finalizada</li>
                                    <li class="f2">2 Tarea finalizada</li>
                                    <li class="f3">3 Tarea finalizada</li>
                                    <li class="f4">4 Tarea finalizada</li>
                                </ul>
                            </div>
                        </article>
                    </div>

                    <div class="col-6 py-5">
                        <article class="container h-100 shadow-sm">
                            <div class="container">
                                <h4>Lista de tareas vigentes</h4>
                                <ul class="vigentes">
                                    <li class="f1">1 Tarea vigente</li>
                                    <li class="f2">2 Tarea vigente</li>
                                    <li class="f3">3 Tarea vigente</li>
                                    <li class="f4">4 Tarea vigente</li>
                                </ul>
                            </div>
                        </article>

                    </div>

                </div>
            </div>
        </section>

    </main>

</body>

</html>
